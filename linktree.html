<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Link in Bio</title>
  <meta name="description" content="Link-in-bio page" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg:        #080b14;
      --bg2:       #0d1120;
      --accent:    #8b5cf6;
      --accent2:   #6366f1;
      --pink:      #ec4899;
      --glow:      rgba(139, 92, 246, 0.3);
      --border:    rgba(255,255,255,0.08);
      --text:      #f1f5f9;
      --muted:     #94a3b8;
      --card:      rgba(255,255,255,0.04);
      --card-h:    rgba(255,255,255,0.08);
      --radius:    18px;
      --t:         0.3s cubic-bezier(0.4,0,0.2,1);
      --font:      'Outfit', sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 3rem 1.25rem 4rem;
      overflow-x: hidden;
      opacity: 0;
      transition: opacity 0.6s ease;
    }

    body.loaded { opacity: 1; }

    /* ── Background blobs ── */
    .blob {
      position: fixed;
      border-radius: 50%;
      filter: blur(90px);
      pointer-events: none;
      z-index: 0;
      opacity: 0.14;
    }
    .blob-1 { width: 480px; height: 480px; background: radial-gradient(circle, #8b5cf6, transparent); top: -180px; right: -120px; animation: bfloat 9s ease-in-out infinite; }
    .blob-2 { width: 360px; height: 360px; background: radial-gradient(circle, #ec4899, transparent); bottom: -140px; left: -100px; animation: bfloat 11s ease-in-out infinite reverse; }

    @keyframes bfloat {
      0%, 100% { transform: translate(0,0) scale(1); }
      50%       { transform: translate(20px,-30px) scale(1.08); }
    }

    /* ── Main wrapper ── */
    .card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
    }

    /* ── Avatar ── */
    .avatar-wrap {
      position: relative;
      margin-bottom: 1.25rem;
    }

    .avatar-ring {
      position: absolute;
      inset: -5px;
      border-radius: 50%;
      background: conic-gradient(from 0deg, #8b5cf6, #6366f1, #ec4899, #8b5cf6);
      animation: spin 5s linear infinite;
      z-index: 0;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .avatar {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid var(--bg);
      position: relative;
      z-index: 1;
      display: block;
    }

    .avatar-fallback {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border: 4px solid var(--bg);
      position: relative;
      z-index: 1;
      display: none;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      font-weight: 800;
      color: white;
    }

    .status-pill {
      position: absolute;
      bottom: 2px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(16,185,129,0.15);
      border: 1px solid rgba(16,185,129,0.4);
      border-radius: 100px;
      padding: 0.2rem 0.65rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.68rem;
      font-weight: 600;
      color: #10b981;
      white-space: nowrap;
      z-index: 2;
    }

    .dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: #10b981;
      animation: blink 1.5s ease-in-out infinite;
    }

    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.3} }

    /* ── Name & tagline ── */
    .greeting {
      font-size: 0.9rem;
      color: var(--muted);
      margin-bottom: 0.2rem;
    }

    .name {
      font-size: 1.85rem;
      font-weight: 800;
      line-height: 1.1;
      letter-spacing: -0.02em;
      text-align: center;
      background: linear-gradient(135deg, var(--accent), var(--pink), var(--accent2));
      background-size: 200%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: gshift 4s ease-in-out infinite;
      margin-bottom: 0.5rem;
    }

    @keyframes gshift {
      0%,100% { background-position: 0% 50%; }
      50%      { background-position: 100% 50%; }
    }

    .tagline {
      font-size: 0.92rem;
      color: var(--muted);
      text-align: center;
      margin-bottom: 2rem;
    }

    /* ── Links container ── */
    .links {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    /* ── Link card ── */
    .link-btn {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 0.95rem 1.4rem;
      border-radius: var(--radius);
      font-size: 0.97rem;
      font-weight: 600;
      text-decoration: none;
      color: var(--text);
      transition: transform var(--t), box-shadow var(--t), background var(--t), border-color var(--t);
      position: relative;
      overflow: hidden;
      cursor: pointer;
      opacity: 0;
      transform: translateY(20px);
      animation: slideUp 0.45s ease forwards;
    }

    @keyframes slideUp {
      to { opacity: 1; transform: translateY(0); }
    }

    .link-btn:hover {
      transform: translateY(-3px) scale(1.015);
    }

    /* Primary */
    .link-btn.primary {
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      box-shadow: 0 4px 20px rgba(139,92,246,0.4);
      color: white;
    }
    .link-btn.primary:hover {
      box-shadow: 0 8px 32px rgba(139,92,246,0.55);
    }

    /* Social */
    .link-btn.social {
      background: var(--card);
      border: 1px solid var(--border);
      backdrop-filter: blur(10px);
    }
    .link-btn.social:hover {
      background: var(--card-h);
      border-color: rgba(139,92,246,0.35);
      box-shadow: 0 4px 24px rgba(139,92,246,0.15);
    }

    /* Outline */
    .link-btn.outline {
      background: transparent;
      border: 1.5px solid var(--border);
    }
    .link-btn.outline:hover {
      background: var(--card);
      border-color: rgba(139,92,246,0.3);
    }

    .link-emoji {
      font-size: 1.3rem;
      flex-shrink: 0;
      width: 36px;
      text-align: center;
    }

    .link-label { flex: 1; }

    .link-arrow {
      font-size: 1rem;
      color: rgba(255,255,255,0.35);
      transition: transform var(--t), color var(--t);
    }
    .link-btn:hover .link-arrow {
      transform: translateX(3px);
      color: rgba(255,255,255,0.7);
    }

    /* ── Footer ── */
    .footer {
      position: relative;
      z-index: 1;
      margin-top: 2.5rem;
      text-align: center;
    }

    .footer a {
      font-size: 0.8rem;
      color: var(--muted);
      text-decoration: none;
      opacity: 0.6;
      transition: opacity var(--t);
    }
    .footer a:hover { opacity: 1; }

    .powered {
      font-size: 0.72rem;
      color: rgba(255,255,255,0.2);
      margin-top: 0.5rem;
    }
  </style>
</head>
<body>
  <!-- Background -->
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>

  <div class="card" id="lt-card">

    <!-- Avatar -->
    <div class="avatar-wrap" id="lt-avatar-wrap">
      <div class="avatar-ring"></div>
      <img id="lt-avatar" class="avatar" src="" alt="Foto Profil"
           onerror="this.style.display='none'; document.getElementById('lt-avatar-fb').style.display='flex'" />
      <div id="lt-avatar-fb" class="avatar-fallback"></div>
      <div class="status-pill" id="lt-status">
        <span class="dot"></span>
        <span id="lt-status-text"></span>
      </div>
    </div>

    <!-- Name -->
    <p class="greeting" id="lt-greeting"></p>
    <h1 class="name" id="lt-name"></h1>
    <p class="tagline" id="lt-tagline"></p>

    <!-- Links -->
    <div class="links" id="lt-links"></div>

  </div>

  <!-- Footer -->
  <div class="footer">
    <a href="index.html">📋 Lihat Biodata Lengkap</a>
    <p class="powered">Powered by link-in-bio</p>
  </div>

  <!-- Load config first, then render -->
  <script src="config.js"></script>
  <script>
    (function render() {
      const C = CONFIG;
      const lt = C.linktree;

      // Avatar
      document.getElementById('lt-avatar').src = C.photo;
      document.getElementById('lt-avatar-fb').textContent = C.name.initials;

      // Status
      document.getElementById('lt-status-text').textContent = C.statusBadge;

      // Name & tagline
      document.getElementById('lt-greeting').textContent = lt.greeting;
      document.getElementById('lt-name').textContent     = C.name.full;
      document.getElementById('lt-tagline').textContent  = lt.tagline;

      // Build links
      const container = document.getElementById('lt-links');
      lt.links.forEach((item, i) => {
        const a = document.createElement('a');
        a.href   = item.url;
        a.className = 'link-btn ' + (item.style || 'social');
        a.style.animationDelay = (i * 0.07) + 's';

        // Open external links in new tab
        if (item.url.startsWith('http')) a.target = '_blank';

        a.innerHTML = `
          <span class="link-emoji">${item.emoji}</span>
          <span class="link-label">${item.label}</span>
          <span class="link-arrow">→</span>
        `;
        container.appendChild(a);
      });

      // Page title
      document.title = C.name.full + ' — Link in Bio';

      // Fade in
      window.addEventListener('load', () => document.body.classList.add('loaded'));
    })();
  </script>
</body>
</html>
